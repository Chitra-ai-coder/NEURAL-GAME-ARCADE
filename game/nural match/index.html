<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL MATCH | ARCADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030308;
            --neon-blue: #00f2fe;
            --neon-pink: #ff0055;
            --neon-green: #00ffcc;
            --neon-red: #ff0033;
            --font-main: 'Orbitron', sans-serif;
            --font-text: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: var(--font-text);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            cursor: none;
        }

        /* --- HYPER ADVANCED BACKGROUND GRAFT --- */
        .scanlines {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%);
            background-size: 100% 4px; z-index: -1; pointer-events: none; opacity: 0.5;
        }
        
        .universe {
            position: fixed; inset: 0; z-index: -3;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #000000 100%);
            overflow: hidden;
        }

        /* Static Graphic: Circuit Overlay */
        .circuit-overlay {
            position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            z-index: -2;
        }

        /* Animatic Graphic 1: Drifting Neural Nodes */
        .node {
            position: absolute; background: radial-gradient(circle, var(--neon-blue) 0%, transparent 70%);
            border-radius: 50%; filter: blur(10px); opacity: 0.15;
            animation: nodeDrift infinite linear;
        }

        @keyframes nodeDrift {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        /* Animatic Graphic 2: Binary Data Streams */
        .binary-stream {
            position: absolute; font-family: monospace; font-size: 10px; color: var(--neon-pink);
            opacity: 0.1; writing-mode: vertical-rl; text-orientation: upright;
            animation: streamFall infinite linear;
        }
        @keyframes streamFall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot {
            position: fixed; width: 6px; height: 6px; background: var(--neon-pink);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
        }
        .cursor-ring {
            position: fixed; width: 30px; height: 30px; border: 2px solid rgba(255, 0, 85, 0.5);
            border-radius: 50%; pointer-events: none; z-index: 9998;
            transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s, border-color 0.2s;
        }

        /* --- HUD (HEADS UP DISPLAY) --- */
        .hud {
            display: flex; justify-content: space-between; width: 900px; max-width: 95vw;
            margin-bottom: 20px; padding: 15px 30px;
            background: rgba(10, 10, 20, 0.5); border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 15px; backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15);
        }
        .hud-item { text-align: center; width: 25%; }
        .hud-title { font-family: var(--font-main); font-size: 0.8rem; color: var(--neon-blue); letter-spacing: 2px; }
        .hud-value { font-size: 2rem; font-weight: 700; color: white; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        .hud-value.highlight { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* --- GAME BOARD --- */
        .grid {
            display: grid;
            gap: 10px;
            perspective: 1000px; 
            transition: all 0.5s ease;
        }

        /* --- CARDS --- */
        .card {
            /* Reduced size significantly to accommodate 32 cards (8x4 grid) */
            width: 70px; height: 95px; 
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            cursor: pointer;
        }

        .card.flipped { transform: rotateY(180deg); }
        
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.8rem; border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        /* Front of card (Hidden side) */
        .card-front {
            background: rgba(15, 15, 25, 0.9);
            border: 2px solid rgba(255, 0, 85, 0.3);
            background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(255, 0, 85, 0.05) 8px, rgba(255, 0, 85, 0.05) 16px);
            transition: 0.3s;
        }
        .card:hover .card-front { border-color: var(--neon-pink); box-shadow: 0 0 25px rgba(255, 0, 85, 0.5); }

        /* Back of card (Revealed side) - GLOWING RUNES */
        .card-back {
            background: rgba(5, 5, 15, 0.98);
            border: 2px solid var(--neon-blue);
            transform: rotateY(180deg);
            box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.3);
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue), 0 0 20px var(--neon-blue), 0 0 30px var(--neon-pink);
            font-family: monospace;
        }

        /* Match & Error Animations */
        .card.matched .card-back {
            border-color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green), 0 0 30px var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.5), inset 0 0 20px rgba(0, 255, 204, 0.3);
            animation: pulseMatch 0.5s ease-out;
        }
        .card.error { animation: shakeError 0.4s; }
        .card.error .card-back { 
            border-color: var(--neon-red); 
            text-shadow: 0 0 10px var(--neon-red), 0 0 30px var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.6); 
        }

        @keyframes pulseMatch { 0% { transform: rotateY(180deg) scale(1); } 50% { transform: rotateY(180deg) scale(1.15); } 100% { transform: rotateY(180deg) scale(1); } }
        @keyframes shakeError { 0%, 100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-10px); } 75% { transform: rotateY(180deg) translateX(10px); } }

        /* --- OVERLAY MODAL (LEVEL UP / GAME OVER) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px); z-index: 5000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .modal-content {
            text-align: center; border: 2px solid var(--neon-blue);
            padding: 50px 80px; border-radius: 20px;
            background: rgba(10, 10, 20, 0.9);
            box-shadow: 0 0 60px rgba(0, 242, 254, 0.3);
            transform: scale(0.8); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-title { font-family: var(--font-main); font-size: 3.5rem; color: white; text-shadow: 0 0 20px var(--neon-blue); margin-bottom: 10px; }
        .modal-stats { font-size: 1.5rem; color: #aaa; margin-bottom: 30px; letter-spacing: 2px; }

        .btn {
            padding: 15px 50px; background: rgba(0,0,0,0.5); border: 2px solid var(--neon-pink);
            color: var(--neon-pink); font-family: var(--font-main); font-weight: 900;
            font-size: 1.2rem; letter-spacing: 4px; cursor: none;
            border-radius: 30px; transition: 0.3s; text-transform: uppercase;
        }
        .btn:hover { background: var(--neon-pink); color: black; box-shadow: 0 0 30px var(--neon-pink); transform: scale(1.05); }

    </style>
</head>
<body>

    <div class="universe">
        <div class="circuit-overlay"></div>
    </div>
    <div class="scanlines"></div>

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <div class="hud">
        <div class="hud-item">
            <div class="hud-title">SYS.LEVEL</div>
            <div class="hud-value highlight" id="levelDisplay">1</div>
        </div>
        <div class="hud-item">
            <div class="hud-title">DECRYPTED</div>
            <div class="hud-value" id="score">0 / 4</div>
        </div>
        <div class="hud-item">
            <div class="hud-title">ATTEMPTS</div>
            <div class="hud-value" id="attempts">0</div>
        </div>
        <div class="hud-item">
            <div class="hud-title">TIME</div>
            <div class="hud-value" id="time">00s</div>
        </div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">LEVEL CLEARED</div>
            <div class="modal-stats" id="modalStats">Time: 12s | Attempts: 8</div>
            <button class="btn" id="modalBtn" onclick="nextLevel()">INITIATE NEXT PROTOCOL</button>
        </div>
    </div>

    <script>
        // --- 1. Custom Cursor Logic ---
        const dot = document.querySelector('.cursor-dot');
        const ring = document.querySelector('.cursor-ring');
        window.addEventListener('mousemove', (e) => {
            dot.style.left = `${e.clientX}px`; dot.style.top = `${e.clientY}px`;
            ring.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 300, fill: "forwards" });
        });

        function bindCursorHover() {
            document.querySelectorAll('button, .card').forEach(el => {
                el.addEventListener('mouseenter', () => { ring.style.width = '50px'; ring.style.height = '50px'; ring.style.borderColor = 'var(--neon-blue)'; dot.style.background = 'var(--neon-blue)'; });
                el.addEventListener('mouseleave', () => { ring.style.width = '30px'; ring.style.height = '30px'; ring.style.borderColor = 'rgba(255, 0, 85, 0.5)'; dot.style.background = 'var(--neon-pink)';});
            });
        }

        // --- 2. Advanced Background Effects Generation ---
        const universe = document.querySelector('.universe');
        function initBackgroundGraft() {
            // Generate Drifting nodes
            for (let i = 0; i < 15; i++) {
                const node = document.createElement('div');
                node.classList.add('node');
                node.style.width = `${Math.random() * 100 + 50}px`;
                node.style.height = node.style.width;
                node.style.left = `${Math.random() * 100}%`;
                node.style.top = `${Math.random() * 100}%`;
                node.style.animationDuration = `${Math.random() * 10 + 10}s`;
                node.style.animationDelay = `${Math.random() * -10}s`;
                universe.appendChild(node);
            }

            // Generate Binary Streams
            for (let i = 0; i < 10; i++) {
                const stream = document.createElement('div');
                stream.classList.add('binary-stream');
                stream.style.left = `${Math.random() * 100}%`;
                stream.style.animationDuration = `${Math.random() * 5 + 5}s`;
                stream.style.animationDelay = `${Math.random() * -5}s`;
                
                // Random binary string
                let binary = "";
                for(let j=0; j<20; j++) binary += Math.round(Math.random()) + "<br>";
                stream.innerHTML = binary;
                
                universe.appendChild(stream);
            }
        }

        // --- 3. GAME LOGIC & LEVELS ---
        const grid = document.getElementById('grid');
        const scoreDisplay = document.getElementById('score');
        const attemptsDisplay = document.getElementById('attempts');
        const timeDisplay = document.getElementById('time');
        const levelDisplay = document.getElementById('levelDisplay');
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalStats = document.getElementById('modalStats');
        const modalBtn = document.getElementById('modalBtn');

        // Extended master array to support 16 pairs (32 cards)
        const masterSymbols = [
            'Δ', 'Ω', 'Φ', 'Ψ', 'Σ', 'Λ', 'Γ', 'Θ', // 8
            'Ξ', 'Π', '∇', '∞', '⌘', '⌥', '§', '¶'  // +8 = 16
        ];
        
        // Revised Level Configuration supporting up to 32 cards
        const levels = [
            { level: 1, pairs: 4, cols: 4 },  // 8 cards
            { level: 2, pairs: 6, cols: 4 },  // 12 cards
            { level: 3, pairs: 8, cols: 4 },  // 16 cards (4x4)
            { level: 4, pairs: 10, cols: 5 }, // 20 cards
            { level: 5, pairs: 12, cols: 6 }, // 24 cards
            { level: 6, pairs: 16, cols: 8 }  // **NEW: 32 CARDS (8x4)**
        ];

        let currentLevelIndex = 0;
        let cards = [];
        let hasFlippedCard = false;
        let lockBoard = false;
        let firstCard, secondCard;
        let matches = 0;
        let attempts = 0;
        let timer;
        let seconds = 0;

        function getLevelData() { return levels[currentLevelIndex]; }

        function shuffle() {
            const levelData = getLevelData();
            const selectedSymbols = masterSymbols.slice(0, levelData.pairs);
            cards = [...selectedSymbols, ...selectedSymbols].sort(() => Math.random() - 0.5);
        }

        function createBoard() {
            const levelData = getLevelData();
            grid.innerHTML = '';
            
            // Adjust Grid Columns dynamically (important for level 6)
            grid.style.gridTemplateColumns = `repeat(${levelData.cols}, 1fr)`;

            shuffle();
            cards.forEach(symbol => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.symbol = symbol;

                card.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back">${symbol}</div>
                `;
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });
            
            bindCursorHover(); // bind new elements
        }

        function startTimer() {
            clearInterval(timer);
            seconds = 0;
            timeDisplay.innerText = '00s';
            timer = setInterval(() => {
                seconds++;
                timeDisplay.innerText = (seconds < 10 ? '0' : '') + seconds + 's';
            }, 1000);
        }

        function flipCard() {
            if (lockBoard) return;
            if (this === firstCard) return;

            this.classList.add('flipped');

            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }

            secondCard = this;
            attempts++;
            attemptsDisplay.innerText = attempts;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.symbol === secondCard.dataset.symbol;
            if (isMatch) disableCards();
            else unflipCards();
        }

        function disableCards() {
            firstCard.removeEventListener('click', flipCard);
            secondCard.removeEventListener('click', flipCard);

            firstCard.classList.add('matched');
            secondCard.classList.add('matched');

            matches++;
            const levelData = getLevelData();
            scoreDisplay.innerText = `${matches} / ${levelData.pairs}`;

            if (matches === levelData.pairs) {
                clearInterval(timer);
                setTimeout(levelComplete, 700);
            }

            resetBoard();
        }

        function unflipCards() {
            lockBoard = true;
            firstCard.classList.add('error');
            secondCard.classList.add('error');

            setTimeout(() => {
                firstCard.classList.remove('flipped', 'error');
                secondCard.classList.remove('flipped', 'error');
                resetBoard();
            }, 1000); // 1 second penalty
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function levelComplete() {
            modalStats.innerText = `Matrix secured in ${seconds}s | Security Breaches: ${attempts}`;
            
            if (currentLevelIndex < levels.length - 1) {
                modalTitle.innerText = `LAYER ${currentLevelIndex + 1} DECRYPTED`;
                modalBtn.innerText = "ACCESS DEEPER LAYER";
            } else {
                modalTitle.innerText = "MAINFRAME COMPROMISED";
                modalTitle.style.color = "var(--neon-green)";
                modalTitle.style.textShadow = "0 0 30px var(--neon-green)";
                modalBtn.innerText = "RESET MAINFRAME";
            }
            
            modal.classList.add('active');
            bindCursorHover(); // Re-bind for modal button
        }

        function nextLevel() {
            modal.classList.remove('active');
            
            if (currentLevelIndex < levels.length - 1) {
                currentLevelIndex++;
            } else {
                currentLevelIndex = 0; // Reboot to level 1
                modalTitle.style.color = "white"; // reset color
                modalTitle.style.textShadow = "0 0 20px var(--neon-blue)";
            }

            initGame();
        }

        function initGame() {
            const levelData = getLevelData();
            matches = 0;
            attempts = 0;
            levelDisplay.innerText = levelData.level;
            scoreDisplay.innerText = `0 / ${levelData.pairs}`;
            attemptsDisplay.innerText = `0`;
            resetBoard();
            createBoard();
            startTimer();
        }

        // --- Initialize Everything ---
        initBackgroundGraft(); // Generate animatic graphics
        bindCursorHover();     // Init cursor for HUD/Btns
        initGame();            // Start level 1
    </script>
</body>
</html>
