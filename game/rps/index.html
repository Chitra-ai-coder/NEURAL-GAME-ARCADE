<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHITRABHANU | NEURAL BATTLE: HIGH CONTRAST</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #010103;
            --panel: rgba(5, 5, 12, 0.92);
            --neon-blue: #00f2fe;
            --neon-pink: #ff0055;
            --neon-green: #0aff99;
            --font-main: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            
            --size-choice-pad: 200px;
            --size-arena-fighter: 180px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }

        body {
            background-color: var(--bg-deep); color: white;
            font-family: var(--font-sub); height: 100vh; display: flex;
            overflow: hidden; perspective: 1000px; 
        }

        /* --- BACKGROUND ENGINE --- */
        .universe-bg { position: fixed; inset: 0; z-index: -3; overflow: hidden; }
        
        .binary-stream {
            position: absolute; inset: -50%; width: 200%; height: 200%;
            z-index: -2; opacity: 0.05;
            font-family: monospace; font-size: 12px; color: var(--neon-blue);
            line-height: 1.2; user-select: none; animation: streamPan 60s linear infinite;
        }
        @keyframes streamPan { from { transform: translateY(0); } to { transform: translateY(50%); } }
        
        .universe-grid {
            position: absolute; inset: 0; z-index: -1;
            background-image: linear-gradient(rgba(0, 242, 254, 0.08) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 254, 0.08) 1px, transparent 1px);
            background-size: 100px 100px; transform: rotateX(60deg) translateY(-200px) translateZ(-200px);
            animation: gridPan 20s linear infinite;
        }
        @keyframes gridPan { from { background-position: 0 0; } to { background-position: 0 100px; } }
        
        .anomaly { position: absolute; background: rgba(255,255,255,0.15); border-radius: 50%; filter: blur(3px); animation: float 15s infinite linear; }
        @keyframes float { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(100px, 100px) rotate(360deg); } }

        /* --- UI OVERLAYS --- */
        .vignette { position: fixed; inset: 0; z-index: 100; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.85) 100%); }
        .scanlines { position: fixed; inset: 0; z-index: 101; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%); background-size: 100% 4px; }

        /* --- ANIMATED BOOT SEQUENCE --- */
        .boot-anim { animation: fadeInUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MAIN TERMINAL --- */
        .game-terminal {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; position: relative; z-index: 10;
        }

        .title-glitch {
            font-family: var(--font-main); font-size: 4.5rem; font-weight: 900; letter-spacing: 20px; margin-bottom: 30px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.9), -2px -2px var(--neon-blue), 2px 2px var(--neon-pink); 
            text-transform: uppercase; text-align: center;
        }

        /* --- BATTLE ARENA --- */
        .arena {
            display: flex; align-items: center; justify-content: center; gap: 60px; 
            height: 340px; /* Increased height to fit nameplates */
            width: 100%; max-width: 900px;
            background: var(--panel); border: 2px solid rgba(255,255,255,0.15); border-radius: 20px; margin-bottom: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 30px rgba(0, 0, 0, 0.8); backdrop-filter: blur(25px); position: relative;
            overflow: hidden; 
        }

        .shockwave {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; border-radius: 50%;
            transform: translate(-50%, -50%); z-index: 0; opacity: 0; pointer-events: none;
        }
        .shockwave.explode-blue { animation: waveAnim 0.6s ease-out; border: 15px solid var(--neon-blue); box-shadow: 0 0 50px var(--neon-blue); }
        .shockwave.explode-pink { animation: waveAnim 0.6s ease-out; border: 15px solid var(--neon-pink); box-shadow: 0 0 50px var(--neon-pink); }
        .shockwave.explode-white { animation: waveAnim 0.6s ease-out; border: 15px solid #fff; box-shadow: 0 0 50px #fff; }
        
        @keyframes waveAnim {
            0% { width: 10px; height: 10px; opacity: 1; }
            100% { width: 800px; height: 800px; opacity: 0; border-width: 1px; }
        }

        /* NEW: Fighter Station Wrappers */
        .fighter-station {
            display: flex; flex-direction: column; align-items: center; gap: 25px; z-index: 2;
        }

        .arena-fighter {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: var(--size-arena-fighter); height: var(--size-arena-fighter); border-radius: 20px;
            background: rgba(0,0,0,0.6); position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .arena-fighter svg { width: 90px; height: 90px; filter: drop-shadow(0 0 20px currentColor); transition: 0.3s; }
        
        .arena-user { --rot-y: -5deg; color: var(--neon-blue); border: 3px solid var(--neon-blue); box-shadow: inset 0 0 30px rgba(0,242,254,0.2), 0 0 50px rgba(0, 242, 254, 0.3); animation: floatIdle 4s ease-in-out infinite; }
        .arena-cpu { --rot-y: 5deg; color: var(--neon-pink); border: 3px solid var(--neon-pink); box-shadow: inset 0 0 30px rgba(255,0,85,0.2), 0 0 50px rgba(255, 0, 85, 0.3); animation: floatIdle 4s ease-in-out infinite reverse; }

        @keyframes floatIdle {
            0%, 100% { transform: translateY(0) rotateY(var(--rot-y)); }
            50% { transform: translateY(-15px) rotateY(var(--rot-y)); box-shadow: 0 15px 50px currentColor; }
        }

        /* NEW: Sleek Nameplates */
        .nameplate {
            font-family: var(--font-main); font-size: 0.85rem; letter-spacing: 4px; font-weight: 700;
            padding: 8px 25px; border-radius: 6px; background: rgba(0,0,0,0.9); text-transform: uppercase;
        }
        .plate-user { color: var(--neon-blue); border: 1px solid rgba(0, 242, 254, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(0, 242, 254, 0.1); }
        .plate-cpu { color: var(--neon-pink); border: 1px solid rgba(255, 0, 85, 0.4); box-shadow: 0 5px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(255, 0, 85, 0.1); }

        .attack-right { animation: lungeRight 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .attack-left { animation: lungeLeft 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .take-hit { animation: getHit 0.5s ease-out; }

        @keyframes lungeRight { 0%, 100% { transform: translateX(0) rotateY(var(--rot-y)) scale(1); } 50% { transform: translateX(40px) rotateY(var(--rot-y)) scale(1.1); z-index: 10; } }
        @keyframes lungeLeft { 0%, 100% { transform: translateX(0) rotateY(var(--rot-y)) scale(1); } 50% { transform: translateX(-40px) rotateY(var(--rot-y)) scale(1.1); z-index: 10; } }
        @keyframes getHit { 0%, 100% { filter: brightness(1); transform: scale(1); } 50% { filter: brightness(0.2) grayscale(1); transform: scale(0.8); } }

        .vs-badge { font-family: var(--font-main); font-size: 3rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px #fff, 0 0 40px #fff; z-index: 2;}

        /* --- CHOICE PADS --- */
        .choices-container { display: flex; gap: 40px; margin-bottom: 50px; z-index: 10; }

        .choice-pad {
            width: var(--size-choice-pad); height: var(--size-choice-pad); border-radius: 20px; 
            background: rgba(0, 0, 0, 0.7); 
            border: 2px solid rgba(0, 242, 254, 0.4);
            display: flex; flex-direction: column; justify-content: center; align-items: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(20px); position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .choice-pad svg { width: 70px; height: 70px; color: var(--neon-blue); margin-bottom: 20px; transition: 0.3s; filter: drop-shadow(0 0 10px var(--neon-blue));}
        .choice-pad label { font-family: var(--font-main); font-size: 0.9rem; font-weight: 700; color: #fff; letter-spacing: 3px; pointer-events: none; text-shadow: 0 0 10px var(--neon-blue); }
        .choice-pad:hover { transform: translateY(-15px); background: rgba(0, 242, 254, 0.15); border-color: #fff; box-shadow: 0 20px 50px rgba(0, 242, 254, 0.4); }
        .choice-pad:hover svg { filter: drop-shadow(0 0 20px var(--neon-blue)); transform: scale(1.15); color: #fff; }
        .choice-pad:active { transform: scale(0.95); }
        .choice-pad.disabled { opacity: 0.4; pointer-events: none; border-color: rgba(0, 242, 254, 0.2); background: rgba(0,0,0,0.9);}

        /* --- STATUS DISPLAY --- */
        .status-display {
            width: 100%; max-width: 700px; padding: 25px; 
            background: linear-gradient(90deg, transparent, rgba(5, 5, 12, 0.95), transparent);
            border-top: 2px solid var(--neon-blue); border-bottom: 2px solid var(--neon-blue); text-align: center; min-height: 90px; display: flex; align-items: center; justify-content: center;
        }
        #msg { 
            font-family: var(--font-main); font-size: 1.4rem; letter-spacing: 5px; text-transform: uppercase; font-weight: 900; color: #fff; 
            text-shadow: 0 5px 10px #000, 0 0 15px rgba(255,255,255,0.5); 
        }
        #msg::after { content: '_'; animation: blinkCursor 1s infinite; }
        @keyframes blinkCursor { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        /* --- HUD --- */
        .sidebar-hud {
            width: 400px; background: linear-gradient(135deg, rgba(5, 5, 12, 0.98), rgba(2, 2, 5, 0.99)); border-left: 2px solid var(--neon-blue);
            display: flex; flex-direction: column; padding: 50px 35px; backdrop-filter: blur(30px); box-shadow: inset 5px 0 20px rgba(0, 242, 254, 0.05), -20px 0 60px rgba(0,0,0,0.9); z-index: 10;
        }
        .hud-header { font-family: var(--font-main); font-size: 1.6rem; color: #fff; font-weight: 900; margin-bottom: 40px; letter-spacing: 4px; text-transform: uppercase; }
        .hud-subtext { font-family: var(--font-sub); font-size: 0.8rem; color: var(--neon-blue); letter-spacing: 4px; margin-top: 5px; opacity: 0.8; }
        .live-dot { display: inline-block; width: 12px; height: 12px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 15px var(--neon-green); animation: blink 1.5s infinite alternate; margin-right: 10px; vertical-align: middle; }
        @keyframes blink { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        .stat-box { 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1); clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px); padding: 30px; margin-bottom: 25px; text-align: center; position: relative; transition: 0.3s; 
        }
        .user-stat { border-bottom: 4px solid var(--neon-blue); box-shadow: inset 0 -10px 20px -10px var(--neon-blue); }
        .cpu-stat { border-bottom: 4px solid var(--neon-pink); box-shadow: inset 0 -10px 20px -10px var(--neon-pink); }
        
        .score-pop { animation: popAnim 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popAnim { 0% { transform: scale(1); } 50% { transform: scale(1.4); color: #fff; } 100% { transform: scale(1); } }

        .stat-label { font-size: 1.1rem; color: #fff; letter-spacing: 4px; font-weight: 700; margin-bottom: 15px; opacity: 0.9;}
        .stat-value { font-family: var(--font-main); font-size: 6rem; font-weight: 900; line-height: 1; margin-bottom: 10px; display: inline-block; text-shadow: 0 10px 20px #000, 0 0 20px currentColor;}
        
        .progress-track { width: 100%; height: 6px; background: rgba(255,255,255,0.15); border-radius: 3px; overflow: hidden; position: relative; margin-top: 15px; }
        .progress-fill { height: 100%; width: 0%; transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .user-fill { background: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); }
        .cpu-fill { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

        .series-info { margin-top: auto; padding: 20px; background: rgba(10, 255, 153, 0.05); border: 1px solid var(--neon-green); color: var(--neon-green); text-align: center; font-weight: 900; letter-spacing: 4px; border-radius: 4px; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,0.8);}
        .btn-reboot { margin-top: 20px; background: rgba(0,0,0,0.8); border: 2px solid var(--neon-pink); color: var(--neon-pink); font-family: var(--font-main); font-size: 1.1rem; padding: 20px; font-weight: 900; letter-spacing: 5px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px; clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px); }
        .btn-reboot:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 30px var(--neon-pink); }

        .shake { animation: arenaShake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes arenaShake { 10%, 90% { transform: translate3d(-3px, 0, 0); } 20%, 80% { transform: translate3d(5px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }

        @media (max-height: 850px) {
            :root { --size-choice-pad: 160px; --size-arena-fighter: 140px; }
            .game-terminal { padding: 20px; }
            .title-glitch { font-size: 3rem; letter-spacing: 10px; margin-bottom: 20px;}
            .arena { height: 260px; margin-bottom: 30px;}
            .vs-badge { font-size: 2.2rem; }
            .choice-pad svg { width: 50px; height: 50px; margin-bottom: 10px; }
            .choice-pad label { font-size: 0.8rem; }
            .choices-container { gap: 20px; margin-bottom: 30px; }
            .sidebar-hud { width: 350px; padding: 30px 25px; }
            .stat-value { font-size: 4rem; margin-bottom: 5px;}
            .stat-box { padding: 20px; margin-bottom: 20px; }
            .hud-header { margin-bottom: 30px; font-size: 1.3rem;}
        }
    </style>
</head>
<body>

    <div class="universe-bg">
        <div class="binary-stream" id="binary-stream"></div>
        <div class="universe-grid"></div>
    </div>

    <div class="vignette"></div>
    <div class="scanlines"></div>

    <main class="game-terminal">
        <h1 class="title-glitch boot-anim">NEURAL BATTLE</h1>

        <div class="arena boot-anim delay-1" id="arena">
            <div class="shockwave" id="shockwave"></div>

            <div class="fighter-station">
                <div class="arena-fighter arena-user" id="arena-user">
                    <i data-lucide="user"></i>
                </div>
                <div class="nameplate plate-user">USER_LINK</div>
            </div>

            <div class="vs-badge">VS</div>

            <div class="fighter-station">
                <div class="arena-fighter arena-cpu" id="arena-cpu">
                    <i data-lucide="cpu"></i>
                </div>
                <div class="nameplate plate-cpu">MAINFRAME</div>
            </div>
        </div>

        <div class="choices-container boot-anim delay-2" id="pads-container">
            <div class="choice-pad" id="rock" onclick="playGame('rock')">
                <i data-lucide="hexagon"></i>
                <label>KINETIC</label>
            </div>
            <div class="choice-pad" id="paper" onclick="playGame('paper')">
                <i data-lucide="shield"></i>
                <label>SHIELD</label>
            </div>
            <div class="choice-pad" id="scissors" onclick="playGame('scissors')">
                <i data-lucide="swords"></i>
                <label>PLASMA</label>
            </div>
        </div>

        <div class="status-display boot-anim delay-3">
            <p id="msg"></p>
        </div>
    </main>

    <aside class="sidebar-hud boot-anim">
        <div class="hud-header">
            <span class="live-dot"></span> LINK_INTERFACE
            <div class="hud-subtext">AWAITING TACTICAL OVERRIDE</div>
        </div>
        
        <div class="stat-box user-stat">
            <div class="stat-label">USER_NEURAL_LINK</div>
            <div id="user-score" class="stat-value" style="color: var(--neon-blue);">0</div>
            <div class="progress-track"><div class="progress-fill user-fill" id="user-bar"></div></div>
        </div>

        <div class="stat-box cpu-stat">
            <div class="stat-label">CPU_CORE_INTEGRITY</div>
            <div id="computer-score" class="stat-value" style="color: var(--neon-pink);">0</div>
            <div class="progress-track"><div class="progress-fill cpu-fill" id="cpu-bar"></div></div>
        </div>

        <div class="series-info">
            <i data-lucide="crosshair"></i> TARGET: 05 WINS
        </div>
        <button class="btn-reboot" onclick="resetGame()">
            <i data-lucide="power"></i> SYSTEM_REBOOT
        </button>
    </aside>

    <script>
        lucide.createIcons();

        // Background generation
        const stream = document.getElementById('binary-stream');
        const universe = document.querySelector('.universe-bg');
        let binaryContent = '';
        for (let i = 0; i < 5000; i++) { binaryContent += Math.round(Math.random()); if (i % 80 === 0) binaryContent += '<br>'; }
        stream.innerHTML = binaryContent;
        for (let i = 0; i < 15; i++) {
            const anomaly = document.createElement('div');
            anomaly.className = 'anomaly';
            const size = Math.random() * 80 + 20;
            anomaly.style.width = size + 'px'; anomaly.style.height = size + 'px';
            anomaly.style.top = Math.random() * 100 + '%'; anomaly.style.left = Math.random() * 100 + '%';
            anomaly.style.animationDelay = Math.random() * 10 + 's'; anomaly.style.opacity = Math.random() * 0.15;
            universe.appendChild(anomaly);
        }

        // Game State
        let userScore = 0; let compScore = 0; let isProcessing = false; const TARGET_WINS = 5;

        // DOM
        const msg = document.getElementById("msg");
        const uDisp = document.getElementById("user-score");
        const cDisp = document.getElementById("computer-score");
        const uBar = document.getElementById("user-bar");
        const cBar = document.getElementById("cpu-bar");
        const arenaUser = document.getElementById("arena-user");
        const arenaCpu = document.getElementById("arena-cpu");
        const padsContainer = document.getElementById("pads-container");
        const arena = document.getElementById("arena");
        const shockwave = document.getElementById("shockwave");

        const iconMap = { 'rock': 'hexagon', 'paper': 'shield', 'scissors': 'swords', 'user': 'user', 'cpu': 'cpu' };

        // TYPEWRITER EFFECT ENGINE
        let typeInterval;
        const typeMessage = (text, color) => {
            clearInterval(typeInterval);
            msg.style.color = color;
            msg.innerText = "";
            let i = 0;
            typeInterval = setInterval(() => {
                msg.innerText += text.charAt(i);
                i++;
                if(i >= text.length) clearInterval(typeInterval);
            }, 30);
        };

        // Init Message
        typeMessage("SYSTEM READY. WAITING FOR INPUT...", "#fff");

        const updateArenaIcon = (element, choice) => {
            element.innerHTML = `<i data-lucide="${iconMap[choice]}"></i>`;
            lucide.createIcons();
        };

        const triggerShockwave = (result) => {
            shockwave.className = 'shockwave'; 
            void shockwave.offsetWidth; 
            if(result === 'user') shockwave.classList.add('explode-blue');
            else if(result === 'cpu') shockwave.classList.add('explode-pink');
            else shockwave.classList.add('explode-white');
        };

        const clearAnimations = () => {
            arenaUser.classList.remove('attack-right', 'take-hit');
            arenaCpu.classList.remove('attack-left', 'take-hit');
            uDisp.classList.remove('score-pop');
            cDisp.classList.remove('score-pop');
        };

        const resetGame = () => {
            userScore = 0; compScore = 0;
            uDisp.innerText = "0"; cDisp.innerText = "0";
            uBar.style.width = "0%"; cBar.style.width = "0%";
            typeMessage("SYSTEM REBOOTED. READY.", "#fff");
            updateArenaIcon(arenaUser, 'user');
            updateArenaIcon(arenaCpu, 'cpu');
            padsContainer.classList.remove('disabled');
            clearAnimations();
        };

        const playGame = (userChoice) => {
            if (isProcessing || userScore === TARGET_WINS || compScore === TARGET_WINS) return;
            isProcessing = true;
            padsContainer.classList.add('disabled');
            clearAnimations();

            typeMessage("CALCULATING TACTICS...", "#aaa");
            updateArenaIcon(arenaUser, userChoice);
            arenaCpu.innerHTML = `<i data-lucide="loader" class="lucide-spin"></i>`;
            lucide.createIcons();

            setTimeout(() => {
                const choices = ["rock", "paper", "scissors"];
                const computerChoice = choices[Math.floor(Math.random() * 3)];
                updateArenaIcon(arenaCpu, computerChoice);
                
                if (userChoice === computerChoice) {
                    typeMessage(`[STALEMATE] BOTH LINKS SYNCED: ${userChoice.toUpperCase()}`, "#fff");
                    triggerShockwave('draw');
                } else {
                    let userWin = 
                        (userChoice === "rock" && computerChoice === "scissors") || 
                        (userChoice === "paper" && computerChoice === "rock") || 
                        (userChoice === "scissors" && computerChoice === "paper");
                    
                    showWinner(userWin, userChoice.toUpperCase(), computerChoice.toUpperCase());
                }

                if (userScore < TARGET_WINS && compScore < TARGET_WINS) {
                    setTimeout(() => {
                        isProcessing = false;
                        padsContainer.classList.remove('disabled');
                    }, 1000); 
                }
            }, 1200); 
        };

        const showWinner = (userWin, uChoice, cChoice) => {
            arena.classList.remove('shake');
            void arena.offsetWidth; 
            arena.classList.add('shake');

            if (userWin) {
                userScore++;
                uDisp.innerText = userScore;
                uBar.style.width = `${(userScore / TARGET_WINS) * 100}%`;
                
                typeMessage(`[SUCCESS] ${uChoice} OVERRIDES ${cChoice}`, "var(--neon-blue)");
                triggerShockwave('user');
                
                arenaUser.classList.add('attack-right');
                arenaCpu.classList.add('take-hit');
                
                void uDisp.offsetWidth;
                uDisp.classList.add('score-pop');

            } else {
                compScore++;
                cDisp.innerText = compScore;
                cBar.style.width = `${(compScore / TARGET_WINS) * 100}%`;
                
                typeMessage(`[FAILURE] ${cChoice} BREACHES ${uChoice}`, "var(--neon-pink)");
                triggerShockwave('cpu');

                arenaCpu.classList.add('attack-left');
                arenaUser.classList.add('take-hit');
                
                void cDisp.offsetWidth;
                cDisp.classList.add('score-pop');
            }

            if (userScore === TARGET_WINS || compScore === TARGET_WINS) {
                const isUserChamp = userScore === TARGET_WINS;
                setTimeout(() => {
                    typeMessage(isUserChamp ? "USER AUTHORIZED: CHAMPION" : "SYSTEM OVERRIDE: CPU VICTOR", isUserChamp ? "var(--neon-green)" : "var(--neon-pink)");
                }, 1000);
                setTimeout(resetGame, 6000);
            }
        };
    </script>
</body>
</html>
