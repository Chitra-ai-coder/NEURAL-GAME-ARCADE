<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIP DRIVE | NEURAL ARCADE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-deep: #000000; /* Pure black for max contrast */
            --neon-blue: #00ffff; /* Brighter, purer cyan */
            --neon-pink: #ff0055;
            --neon-purple: #b517ff;
            --font-main: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; user-select: none; }

        body {
            background-color: var(--bg-deep); color: white;
            font-family: var(--font-sub); height: 100vh; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            flex-direction: column;
        }

        /* --- BACKGROUND GRAFT (Cleaner, Less Muddy) --- */
        .scanlines { position: fixed; inset: 0; z-index: 999; pointer-events: none; background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0, 0, 0, 0.25) 50%); background-size: 100% 4px; }
        .vignette { position: fixed; inset: 0; z-index: 998; pointer-events: none; background: radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.85) 100%); }

        /* --- CUSTOM CURSOR --- */
        .cursor-dot { position: fixed; width: 6px; height: 6px; background: var(--neon-blue); border-radius: 50%; pointer-events: none; z-index: 10000; transform: translate(-50%, -50%); box-shadow: 0 0 15px var(--neon-blue); }
        .cursor-ring { position: fixed; width: 30px; height: 30px; border: 2px solid rgba(0, 255, 255, 0.8); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }

        /* --- HUD (More vibrant) --- */
        .hud {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 1300px; padding: 15px 50px; margin-bottom: 20px;
            background: rgba(10, 10, 15, 0.9); border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,1), inset 0 0 20px rgba(0, 255, 255, 0.15);
            backdrop-filter: blur(20px); z-index: 10;
        }
        .stat-box { display: flex; flex-direction: column; align-items: center; width: 30%; }
        .stat-label { font-size: 0.9rem; color: #fff; letter-spacing: 4px; font-weight: 900; margin-bottom: 5px; opacity: 0.8;}
        .stat-value { font-family: var(--font-main); font-size: 3rem; color: #fff; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        
        .dist-level { color: var(--neon-blue); text-shadow: 0 0 20px var(--neon-blue); }
        .speed-level { color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); }

        /* --- BIGGER ARENA --- */
        .arena-container {
            position: relative; border: 3px solid rgba(181, 23, 255, 0.6); border-radius: 12px;
            box-shadow: 0 30px 80px rgba(0,0,0,1), 0 0 50px rgba(181, 23, 255, 0.3);
            background: #000000; overflow: hidden;
            width: 100%; max-width: 1300px; height: 700px; /* INCREASED SIZE */
        }

        canvas { display: block; width: 100%; height: 100%; cursor: none; }

        /* --- SCREENS --- */
        .overlay {
            position: absolute; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 50; transition: opacity 0.4s; border-radius: 10px;
        }
        .hidden { opacity: 0; pointer-events: none; z-index: -1; }

        .title-glitch {
            font-family: var(--font-main); font-size: 6.5rem; font-weight: 900; letter-spacing: 15px; margin-bottom: 10px;
            text-shadow: 0 10px 40px #000, -4px -4px var(--neon-blue), 4px 4px var(--neon-pink); text-transform: uppercase; text-align: center; color: #fff;
        }
        .subtitle { font-size: 1.5rem; color: #fff; letter-spacing: 10px; margin-bottom: 50px; text-transform: uppercase; text-shadow: 0 0 20px rgba(255,255,255,0.5); font-weight: 700;}

        .cyber-btn {
            background: rgba(0,0,0,0.9); border: 2px solid var(--neon-blue); color: var(--neon-blue);
            padding: 15px 60px; font-family: var(--font-main); font-size: 1.5rem; font-weight: 900;
            letter-spacing: 5px; cursor: pointer; transition: 0.3s; text-transform: uppercase;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), inset 0 0 15px rgba(0, 255, 255, 0.2); border-radius: 6px;
        }
        .cyber-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 50px var(--neon-blue); transform: translateY(-3px) scale(1.05); }
        .btn-red { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 15px rgba(255, 0, 85, 0.2); }
        .btn-red:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 50px var(--neon-pink); }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <div class="hud">
        <div class="stat-box">
            <span class="stat-label">DISTANCE</span>
            <span class="stat-value dist-level" id="score">0000</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">RECORD</span>
            <span class="stat-value" id="high-score">0000</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">VELOCITY</span>
            <span class="stat-value speed-level" id="speed-disp">9.0</span>
        </div>
    </div>

    <div class="arena-container" id="arena-wrap">
        <canvas id="gameCanvas"></canvas>
        
        <div class="overlay" id="start-menu">
            <h1 class="title-glitch">ZIP DRIVE</h1>
            <div class="subtitle">GRAVITY INVERSION PROTOCOL</div>
            <p style="color: #0aff99; letter-spacing: 5px; margin-bottom: 40px; font-weight: 900; font-size: 1.2rem; text-shadow: 0 0 15px #0aff99;">[ CLICK OR SPACEBAR TO FLIP GRAVITY ]</p>
            <button class="cyber-btn" onclick="startGame()">ENGAGE DRIVE</button>
        </div>

        <div class="overlay hidden" id="game-over-menu">
            <h1 class="title-glitch" style="color: var(--neon-pink); text-shadow: 0 10px 40px #000, -5px -5px var(--neon-purple), 5px 5px #fff;">CRITICAL IMPACT</h1>
            <div class="subtitle" style="color: #fff;" id="end-desc">DATA PACKET DESTROYED AT 0 METERS</div>
            <button class="cyber-btn btn-red" onclick="startGame()"><i data-lucide="rotate-ccw" style="display:inline; margin-right:10px;"></i> RESTART DRIVE</button>
        </div>
    </div>

<script>
    lucide.createIcons();

    // Custom Cursor
    const dot = document.querySelector('.cursor-dot');
    const ring = document.querySelector('.cursor-ring');
    window.addEventListener('mousemove', (e) => {
        dot.style.left = `${e.clientX}px`; dot.style.top = `${e.clientY}px`;
        ring.animate({ left: `${e.clientX}px`, top: `${e.clientY}px` }, { duration: 150, fill: "forwards" });
    });

    document.querySelectorAll('button').forEach(el => {
        el.addEventListener('mouseenter', () => { ring.style.width = '60px'; ring.style.height = '60px'; ring.style.borderColor = 'var(--neon-pink)'; dot.style.background = 'var(--neon-pink)'; });
        el.addEventListener('mouseleave', () => { ring.style.width = '30px'; ring.style.height = '30px'; ring.style.borderColor = 'rgba(0, 255, 255, 0.8)'; dot.style.background = 'var(--neon-blue)'; });
    });

    // Canvas Setup
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    
    // INCREASED LOGICAL SIZE FOR CLARITY
    const LOGICAL_WIDTH = 1300;
    const LOGICAL_HEIGHT = 700;

    function setupCanvas() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = LOGICAL_WIDTH * dpr;
        canvas.height = LOGICAL_HEIGHT * dpr;
        ctx.scale(dpr, dpr);
    }
    setupCanvas();

    // --- GAME VARIABLES SCALED FOR BIGGER SCREEN ---
    let gameLoopId;
    let isPlaying = false;
    let distance = 0;
    let score = 0;
    let highScore = localStorage.getItem('zipDriveHS') || 0;
    document.getElementById('high-score').innerText = highScore.toString().padStart(4, '0');
    
    // Adjusted physics for the taller 700px screen
    let baseSpeed = 9.0;     
    let currentSpeed = baseSpeed;
    let gravity = 0.6;       // Smooth glide
    let jumpForce = 11;      // Responsive but controllable jump

    let shakeAmount = 0;

    // Entities
    let player = { x: 250, y: LOGICAL_HEIGHT / 2, size: 34, vy: 0, isFlipped: false, history: [] };
    let obstacles = [];
    let particles = [];
    let speedLines = [];
    let stars = [];

    // Background Parallax Stars
    for(let i=0; i<100; i++) {
        stars.push({
            x: Math.random() * LOGICAL_WIDTH, y: Math.random() * LOGICAL_HEIGHT,
            size: Math.random() * 2 + 1, speedMult: Math.random() * 0.5 + 0.1,
            color: Math.random() > 0.5 ? '#b517ff' : '#00ffff'
        });
    }

    // Input Handling
    function flipGravity() {
        if (!isPlaying) return;
        player.isFlipped = !player.isFlipped;
        player.vy = player.isFlipped ? -jumpForce : jumpForce; 
        
        shakeAmount = 3; // Crisp feedback
        spawnParticles(player.x, player.y, player.isFlipped ? '#00ffff' : '#ff0055', 12, 6);
    }

    window.addEventListener('mousedown', flipGravity);
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space') { e.preventDefault(); flipGravity(); }
    });

    // Spawning Logic for Bigger Screen
    function spawnObstacle() {
        let maxGap = 450;
        let minGap = 280; 
        let gap = Math.max(minGap, maxGap - (distance / 450)); 

        let topHeight = Math.random() * (LOGICAL_HEIGHT - gap - 80) + 40;
        let bottomHeight = LOGICAL_HEIGHT - topHeight - gap;

        let isPurple = Math.random() > 0.5;
        let mainColor = isPurple ? '#b517ff' : '#ff0055';
        let coreColor = isPurple ? '#00ffff' : '#ffffff';

        obstacles.push({
            x: LOGICAL_WIDTH + 100, w: 90,
            topH: topHeight, botH: bottomHeight,
            mainColor: mainColor, coreColor: coreColor, passed: false
        });
    }

    class Particle {
        constructor(x, y, color, maxSpeed) {
            this.x = x; this.y = y; this.color = color;
            this.angle = Math.random() * Math.PI * 2;
            this.speed = Math.random() * maxSpeed + 2;
            this.vx = Math.cos(this.angle) * this.speed;
            this.vy = Math.sin(this.angle) * this.speed;
            this.life = 1.0; this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 6 + 3;
        }
        update() {
            this.x += this.vx - (currentSpeed * 0.7); 
            this.y += this.vy;
            this.life -= this.decay;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.shadowBlur = 20; ctx.shadowColor = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;
        }
    }

    function spawnParticles(x, y, color, amt, maxSpeed) {
        for(let i=0; i<amt; i++) particles.push(new Particle(x, y, color, maxSpeed));
    }

    function startGame() {
        document.getElementById('start-menu').classList.add('hidden');
        document.getElementById('game-over-menu').classList.add('hidden');
        
        distance = 0; score = 0;
        currentSpeed = baseSpeed;
        player = { x: 250, y: LOGICAL_HEIGHT / 2, size: 34, vy: 0, isFlipped: false, history: [] };
        obstacles = [];
        particles = [];
        speedLines = [];
        shakeAmount = 0;
        
        spawnObstacle();
        isPlaying = true;
        gameLoop();
    }

    function triggerGameOver() {
        isPlaying = false;
        cancelAnimationFrame(gameLoopId);
        
        shakeAmount = 30; // Brutal impact
        spawnParticles(player.x, player.y, '#ffffff', 100, 25); 
        spawnParticles(player.x, player.y, '#ff0055', 60, 18); 
        
        draw(); 

        if (score > highScore) {
            highScore = score;
            localStorage.setItem('zipDriveHS', highScore);
            document.getElementById('high-score').innerText = highScore.toString().padStart(4, '0');
        }

        setTimeout(() => {
            document.getElementById('end-desc').innerText = `DATA PACKET DESTROYED AT ${score} METERS`;
            document.getElementById('game-over-menu').classList.remove('hidden');
        }, 1000);
    }

    function update() {
        distance += currentSpeed;
        score = Math.floor(distance / 50);
        
        // Steady acceleration
        currentSpeed = baseSpeed + (Math.pow(score, 0.8) / 14);
        
        document.getElementById('speed-disp').innerText = currentSpeed.toFixed(1);
        document.getElementById('score').innerText = score.toString().padStart(4, '0');

        // Player Physics
        player.vy += player.isFlipped ? -gravity : gravity;
        if (player.vy > 14) player.vy = 14;
        if (player.vy < -14) player.vy = -14;
        player.y += player.vy;

        // Collision bounds
        if (player.y - (player.size/2) < 0 || player.y + (player.size/2) > LOGICAL_HEIGHT) {
            triggerGameOver(); return;
        }

        // Stronger engine trail
        spawnParticles(player.x - 15, player.y, player.isFlipped ? '#00ffff' : '#ff0055', 3, 5);

        player.history.push({ x: player.x, y: player.y });
        if (player.history.length > 15) player.history.shift(); 

        // Starfield & Lines
        stars.forEach(s => {
            s.x -= currentSpeed * s.speedMult;
            if (s.x < 0) { s.x = LOGICAL_WIDTH; s.y = Math.random() * LOGICAL_HEIGHT; }
        });

        if (Math.random() < currentSpeed / 100) {
            speedLines.push({ x: LOGICAL_WIDTH, y: Math.random() * LOGICAL_HEIGHT, length: Math.random() * 300 + 100 });
        }
        speedLines.forEach(l => l.x -= currentSpeed * 2.2);
        speedLines = speedLines.filter(l => l.x + l.length > 0);

        // Obstacles
        if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < LOGICAL_WIDTH - 600 + (Math.random() * 150)) {
            spawnObstacle();
        }

        for (let i = 0; i < obstacles.length; i++) {
            let obs = obstacles[i];
            obs.x -= currentSpeed;

            let hitboxFactor = 0.6; // Forgiving hitbox for fast speeds
            let pRight = player.x + (player.size * hitboxFactor);
            let pLeft = player.x - (player.size * hitboxFactor);
            let pTop = player.y - (player.size * hitboxFactor);
            let pBot = player.y + (player.size * hitboxFactor);

            let oRight = obs.x + obs.w;
            let oLeft = obs.x;

            if (pRight > oLeft && pLeft < oRight) {
                if (pTop < obs.topH || pBot > LOGICAL_HEIGHT - obs.botH) {
                    triggerGameOver();
                }
            }
        }
        obstacles = obstacles.filter(obs => obs.x + obs.w > 0);
        particles.forEach(p => p.update());
        particles = particles.filter(p => p.life > 0);
        
        if (shakeAmount > 0) shakeAmount *= 0.8;
    }

    function draw() {
        ctx.save();
        if (shakeAmount > 0.5) {
            ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        }

        // PURE BLACK BACKGROUND FOR MAX CONTRAST
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#000000'; 
        ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

        // Brighter Tunnel Gradients
        let topGrad = ctx.createLinearGradient(0, 0, 0, 120);
        topGrad.addColorStop(0, 'rgba(0, 255, 255, 0.2)'); topGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = topGrad; ctx.fillRect(0, 0, LOGICAL_WIDTH, 120);
        
        let botGrad = ctx.createLinearGradient(0, LOGICAL_HEIGHT, 0, LOGICAL_HEIGHT - 120);
        botGrad.addColorStop(0, 'rgba(255, 0, 85, 0.2)'); botGrad.addColorStop(1, 'transparent');
        ctx.fillStyle = botGrad; ctx.fillRect(0, LOGICAL_HEIGHT - 120, LOGICAL_WIDTH, 120);

        // Parallax Stars
        ctx.globalCompositeOperation = 'lighter';
        stars.forEach(s => {
            ctx.fillStyle = s.color;
            ctx.globalAlpha = s.speedMult + 0.3;
            ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
        });

        // Speed Lines
        ctx.lineWidth = 4;
        speedLines.forEach(l => {
            let grad = ctx.createLinearGradient(l.x, l.y, l.x + l.length, l.y);
            grad.addColorStop(0, "transparent"); grad.addColorStop(1, "rgba(255, 255, 255, 0.8)");
            ctx.strokeStyle = grad;
            ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x + l.length, l.y); ctx.stroke();
        });
        ctx.globalAlpha = 1.0;

        // CRYSTAL PLASMA OBSTACLES (High contrast, transparent core)
        ctx.globalCompositeOperation = 'source-over';
        obstacles.forEach(obs => {
            ctx.fillStyle = '#000000'; // Solid black base to block stars behind it
            ctx.fillRect(obs.x, 0, obs.w, obs.topH);
            ctx.fillRect(obs.x, LOGICAL_HEIGHT - obs.botH, obs.w, obs.botH);

            ctx.strokeStyle = obs.mainColor; ctx.lineWidth = 4;
            ctx.shadowBlur = 30; ctx.shadowColor = obs.mainColor;
            
            // Draw transparent color over the black base
            ctx.fillStyle = obs.mainColor + '33'; // 20% opacity hex
            
            // Top
            ctx.fillRect(obs.x, 0, obs.w, obs.topH);
            ctx.strokeRect(obs.x, -5, obs.w, obs.topH + 5);
            // Core Light
            ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 40; ctx.shadowColor = obs.coreColor;
            ctx.fillRect(obs.x + 20, obs.topH - 25, obs.w - 40, 25);

            // Bottom
            ctx.fillStyle = obs.mainColor + '33'; ctx.shadowBlur = 30; ctx.shadowColor = obs.mainColor;
            ctx.fillRect(obs.x, LOGICAL_HEIGHT - obs.botH, obs.w, obs.botH);
            ctx.strokeRect(obs.x, LOGICAL_HEIGHT - obs.botH - 5, obs.w, obs.botH + 5);
            // Core Light
            ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 40; ctx.shadowColor = obs.coreColor;
            ctx.fillRect(obs.x + 20, LOGICAL_HEIGHT - obs.botH, obs.w - 40, 25);
            
            ctx.shadowBlur = 0;
        });

        // HIGH CONTRAST PLAYER TRAIL
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < player.history.length; i++) {
            let pt = player.history[i];
            let opacity = i / player.history.length;
            ctx.fillStyle = player.isFlipped ? '#00ffff' : '#ff0055';
            ctx.globalAlpha = opacity * 0.6; // Much brighter trail
            ctx.beginPath();
            ctx.arc(pt.x - (player.history.length - i)*6, pt.y, player.size * opacity, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1.0;
        
        particles.forEach(p => p.draw(ctx));

        // PLAYER DART (Bigger, brighter)
        ctx.globalCompositeOperation = 'source-over';
        ctx.shadowBlur = 30; 
        ctx.shadowColor = player.isFlipped ? '#00ffff' : '#ff0055';
        
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.vy * 0.05);
        
        ctx.beginPath();
        ctx.moveTo(player.size, 0); 
        ctx.lineTo(-player.size, player.size * 0.6); 
        ctx.lineTo(-player.size * 0.4, 0); 
        ctx.lineTo(-player.size, -player.size * 0.6); 
        ctx.closePath();
        
        ctx.fillStyle = '#ffffff'; // Pure white core
        ctx.fill();
        
        // Glowing Neon outline
        ctx.strokeStyle = player.isFlipped ? '#00ffff' : '#ff0055';
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // Engine Core
        ctx.fillStyle = player.isFlipped ? '#00ffff' : '#ff0055';
        ctx.beginPath(); ctx.arc(-player.size * 0.3, 0, player.size * 0.3, 0, Math.PI*2); ctx.fill();

        ctx.restore();
        ctx.shadowBlur = 0;

        ctx.restore(); 
    }

    function gameLoop() {
        if (!isPlaying) return;
        update();
        draw();
        gameLoopId = requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
